<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniStock · Inventory</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<nav class="topbar">
  <div class="topbar-brand">UniStock</div>
  <div class="topbar-nav">
    <a href="dashboard.html" class="topbar-link">Dashboard</a>
    <a href="rooms.html" class="topbar-link">Rooms</a>
    <a href="items.html" class="topbar-link active">Inventory</a>
  </div>
  <button class="btn-sm" id="logoutBtn" onclick="logout()">Sign out</button>
</nav>

<main class="page">
  <div class="page-header">
    <h1 class="page-title">Inventory Management</h1>
    <button class="btn-primary btn-sm" id="addItemBtn" onclick="showAddItem()">+ Add Item</button>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <select class="form-input filter-input" id="filterRoom" onchange="loadItems()">
      <option value="">All Rooms</option>
    </select>
    <select class="form-input filter-input" id="filterStatus" onchange="loadItems()">
      <option value="">All Status</option>
      <option value="Active">Active</option>
      <option value="Decommissioned">Decommissioned</option>
    </select>
  </div>

  <!-- Add / Edit Item Modal -->
  <div class="modal-overlay" id="itemModal" style="display:none">
    <div class="modal-card">
      <div class="modal-title" id="itemModalTitle">Add Item</div>
      <input type="hidden" id="editItemId">
      <div class="form-group">
        <label class="form-label" for="itemName">Item Name</label>
        <input class="form-input" id="itemName" type="text" placeholder="e.g. Dell Desktop PC">
      </div>
      <div class="form-group">
        <label class="form-label" for="itemType">Item Type</label>
        <input class="form-input" id="itemType" type="text" placeholder="e.g. Desktop, Monitor, Chair">
      </div>
      <div class="form-group">
        <label class="form-label" for="itemRoom">Room</label>
        <select class="form-input" id="itemRoom"></select>
      </div>
      <div class="form-group">
        <label class="form-label" for="purchaseDate">Purchase Date</label>
        <input class="form-input" id="purchaseDate" type="date">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeItemModal()">Cancel</button>
        <button class="btn-primary" onclick="saveItem()">Save</button>
      </div>
      <div class="form-error" id="itemErr"></div>
    </div>
  </div>

  <table class="data-table" id="itemsTable">
    <thead>
      <tr>
        <th>Item ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Room</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="itemsBody"></tbody>
  </table>
</main>

<script src="js/login.js"></script>
<script src="js/items.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniStock · Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">

  <div class="login-logo">University Inventory Management</div>
  <div class="login-tagline">University of Hyderabad · SCIS</div>

  <div class="login-card">
    <div class="login-card-title">Sign in</div>
    <div class="login-card-sub">Enter your credentials to continue</div>

    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input class="form-input" id="username" type="text"
             placeholder="your username" autocomplete="username">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" id="password" type="password"
             placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-primary" id="loginBtn" onclick="login()">Continue</button>

    <div class="form-error" id="err"></div>
  </div>

</div>

<script src="js/login.js"></script>
</body>
</html>

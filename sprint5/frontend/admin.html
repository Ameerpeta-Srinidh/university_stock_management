<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniStock · Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<nav class="topbar">
  <div class="topbar-brand">UniStock</div>
  <div class="topbar-nav">
    <a href="dashboard.html" class="topbar-link">Dashboard</a>
    <a href="rooms.html" class="topbar-link">Rooms</a>
    <a href="items.html" class="topbar-link">Inventory</a>
    <a href="verify.html" class="topbar-link">Verify</a>
    <a href="history.html" class="topbar-link">History</a>
    <a href="analytics.html" class="topbar-link">Analytics</a>
    <a href="admin.html" class="topbar-link active" id="navAdmin">Admin</a>
  </div>
  <button class="btn-sm" id="logoutBtn" onclick="logout()">Sign out</button>
</nav>

<main class="page">
  <div class="page-header">
    <h1 class="page-title">User Management</h1>
    <button class="btn-primary btn-sm" id="addUserBtn" onclick="showAddUser()">+ Add User</button>
  </div>

  <!-- Add User Modal -->
  <div class="modal-overlay" id="userModal" style="display:none">
    <div class="modal-card">
      <div class="modal-title">Add User</div>
      <div class="form-group">
        <label class="form-label" for="newUsername">Username</label>
        <input class="form-input" id="newUsername" type="text" placeholder="e.g. officer2">
      </div>
      <div class="form-group">
        <label class="form-label" for="newPassword">Password</label>
        <input class="form-input" id="newPassword" type="password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label class="form-label" for="newRole">Role</label>
        <select class="form-input" id="newRole">
          <option value="VO">Verification Officer (VO)</option>
          <option value="Admin">Admin</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeUserModal()">Cancel</button>
        <button class="btn-primary" onclick="saveUser()">Save</button>
      </div>
      <div class="form-error" id="userErr"></div>
    </div>
  </div>

  <table class="data-table" id="usersTable">
    <thead>
      <tr>
        <th>User ID</th>
        <th>Username</th>
        <th>Role</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="usersBody"></tbody>
  </table>

  <h2 class="page-title" style="margin-top: 2rem;">Recent Activity Log</h2>
  <table class="data-table" id="logTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Item</th>
        <th>Officer</th>
        <th>Date</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="logBody"></tbody>
  </table>
</main>

<script src="js/login.js"></script>
<script src="js/admin.js"></script>
</body>
</html>

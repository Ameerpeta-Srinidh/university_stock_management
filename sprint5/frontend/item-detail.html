<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniStock · Item Detail</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/qrcode.css">
</head>
<body>

<nav class="topbar">
  <div class="topbar-brand">UniStock</div>
  <div class="topbar-nav">
    <a href="dashboard.html" class="topbar-link">Dashboard</a>
    <a href="rooms.html" class="topbar-link">Rooms</a>
    <a href="items.html" class="topbar-link active">Inventory</a>
    <a href="verify.html" class="topbar-link">Verify</a>
    <a href="history.html" class="topbar-link">History</a>
    <a href="analytics.html" class="topbar-link">Analytics</a>
    <a href="admin.html" class="topbar-link" id="navAdmin" style="display:none">Admin</a>
  </div>
  <button class="btn-sm" id="logoutBtn" onclick="logout()">Sign out</button>
</nav>

<main class="page">
  <a href="items.html" class="back-link">← Back to Inventory</a>

  <div class="detail-grid">
    <div class="detail-card">
      <h1 class="page-title" id="itemName">—</h1>
      <div class="detail-row">
        <span class="detail-label">Item ID</span>
        <span class="detail-value" id="itemId">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Type</span>
        <span class="detail-value" id="itemType">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Room</span>
        <span class="detail-value" id="itemRoom">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Department</span>
        <span class="detail-value" id="itemDept">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Purchase Date</span>
        <span class="detail-value" id="itemDate">—</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-value" id="itemStatus">—</span>
      </div>
      <div class="detail-row" style="margin-top: 1rem; border-top: 1px dashed #eee; padding-top: 1rem;">
        <span class="detail-label">Verification Status</span>
        <span class="detail-value"><span class="badge" id="verBadge">—</span></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Last Verified</span>
        <span class="detail-value" id="verLast">—</span>
      </div>
    </div>

    <div class="qr-card">
      <div class="qr-title">QR Code</div>
      <div class="qr-display" id="qrDisplay">
        <div class="qr-placeholder">No QR code generated yet</div>
      </div>
      <button class="btn-primary" id="generateQrBtn" onclick="generateQR()">Generate QR Code</button>
    </div>
  </div>
</main>

<script src="js/login.js"></script>
<script src="js/item-detail.js"></script>
</body>
</html>
